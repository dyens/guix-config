set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on


unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# s НЕ переопределяем: за ним штатный choose-tree, переключатель сессий.
# Вертикальный сплит — на "-" ниже.

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
# display-message в конце — иначе source-file молчит, и не понять,
# нажалось ли вообще.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "конфиг перечитан: #{config_files}"

# ── Имена окон ────────────────────────────────────────────────────────
# По умолчанию tmux сам переименовывает окно в имя запущенной программы
# (automatic-rename), а шелл вдобавок подсовывает туда рабочий каталог
# через escape-последовательность (allow-rename). Отсюда и брался путь
# в статусбаре. Выключаем оба: имя окна задаём только мы.
set -g automatic-rename off
set -g allow-rename off

# Новое окно — безымянное, в статусбаре останется голый номер.
unbind c
bind c new-window -c "#{pane_current_path}" -n ''

# prefix , — дать имя. Приглашение пустое: старое стирать не надо.
unbind ,
bind , command-prompt -p "имя окна:" -I "" "rename-window -- '%%'"
# prefix M-, — снять имя, вернуть голый номер.
bind M-, rename-window ''

# Перенести окно влево/вправо (на краях заворачивается по кругу).
# -d — остаёмся в том же окне, оно просто уезжает вместе с нами.
bind < swap-window -d -t -1
bind > swap-window -d -t +1
# То же без prefix — если терминал умеет слать Ctrl-Shift-стрелки.
bind -n C-S-Left  swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

# Tokyonight Moon theme colors
thm_bg="#222436"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"

# Status bar
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"
# Вкладка — это номер и, если задано, имя: «2» или «2: build».
# Условие — «имя пустое ИЛИ равно bash» -> не показывать ничего, иначе
# ": имя". Про bash: первое окно сессии tmux называет по команде, и это
# «bash» — информации ноль, прячем наравне с пустым.
# Statusline - current window
set -g window-status-current-format "#[fg=${thm_bg},bg=${thm_blue},bold] #I#{?#{||:#{==:#W,},#{==:#W,bash}},,: #W} #[default]"

# Statusline - other windows
set -g window-status-format "#[fg=${thm_fg},bg=${thm_bg}] #I#{?#{||:#{==:#W,},#{==:#W,bash}},,: #W} "

# Имя окна (#W) заменено на имя машины: имена вкладок теперь чаще пустые,
# а по ssh полезнее видеть, на какой VM сидишь.
# Statusline - right side
set -g status-right "#[fg=${thm_blue},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #{host_short} #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"


